name: Sign IPA
run-name: "signedAppId=${{ inputs.signedAppId }}"

on:
  workflow_dispatch:
    inputs:
      downloadUrl:
        description: HTTPS download URL for the input IPA
        type: string
        required: true
      appKey:
        description: Destination object key for the signed IPA
        type: string
        required: true
      signedAppId:
        description: Identifier for the signed app
        type: string
        required: true
      certificateId:
        description: Certificate set ID in signstore-signer
        type: string
        required: true
      bundleId:
        description: Final bundle identifier
        type: string
        required: false
      bundleDisplayName:
        description: Final app display name
        type: string
        required: false

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Create signer access token
        id: signer-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets._GITHUB_APP_ID }}
          private-key: ${{ secrets._GITHUB_APP_PEM }}
          owner: signstore-ios
          repositories: |
            signstore-signer
            signstore-apps
          permission-contents: read

      - name: Check out private signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signstore-ios/signstore-signer
          ref: main
          token: ${{ steps.signer-token.outputs.token }}
          path: signer
          persist-credentials: false

      - name: Install signing dependencies
        run: |
          tools_dir="$RUNNER_TEMP/signing-tools"
          mkdir -p "$tools_dir"
          for package in signer/vendor/ubuntu-24.04-amd64/*.deb; do
            dpkg-deb --extract "$package" "$tools_dir"
          done
          echo "$tools_dir/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$tools_dir/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Download IPA
        env:
          IPA_DOWNLOAD_TOKEN: ${{ steps.signer-token.outputs.token }}
        run: |
          url=$(jq -er '.inputs.downloadUrl | select(startswith("https://") and (test("[[:cntrl:]]") | not))' "$GITHUB_EVENT_PATH") || {
            echo "::error::downloadUrl must be an HTTPS URL"
            exit 1
          }
          python3 ./signer/download.py -- "$url" "$RUNNER_TEMP/unsigned.ipa"

      - name: Sign IPA
        env:
          CERTIFICATE_ID: ${{ inputs.certificateId }}
        run: |
          if [[ ! "$CERTIFICATE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::certificateId must be numeric"
            exit 1
          fi
          bundle_id=$(jq -r '.inputs.bundleId // empty' "$GITHUB_EVENT_PATH")
          bundle_display_name=$(jq -r '.inputs.bundleDisplayName // empty' "$GITHUB_EVENT_PATH")
          bundle_args=()
          if [[ -n "$bundle_id" ]]; then
            bundle_args+=("--bundle-id=$bundle_id")
          fi
          if [[ -n "$bundle_display_name" ]]; then
            bundle_args+=("--bundle-display-name=$bundle_display_name")
          fi
          # The signing logs can identify the app and signing team.
          if ! python3 ./signer/sign.py "$RUNNER_TEMP/unsigned.ipa" "signer/certificates/$CERTIFICATE_ID" \
              "$RUNNER_TEMP/signed.ipa" "${bundle_args[@]}" > "$RUNNER_TEMP/signing.log" 2>&1; then
            if grep -qx 'SIGNING_ERROR_MISSING_PROFILE' "$RUNNER_TEMP/signing.log"; then
              echo "::error::A provisioning profile is missing for an app extension."
            elif grep -qx 'SIGNING_ERROR_INVALID_IPA' "$RUNNER_TEMP/signing.log"; then
              echo "::error::The downloaded file is not an IPA archive."
            elif grep -qx 'SIGNING_ERROR_EXPIRED_PROFILE' "$RUNNER_TEMP/signing.log"; then
              echo "::error::A provisioning profile has expired."
            else
              echo "::error::IPA signing failed. Check the selected certificate and provisioning profiles."
            fi
            exit 1
          fi

      - name: Upload signed IPA
        env:
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
        run: |
          if ! object_key=$(jq -er '
            .inputs.appKey | strings
            | select(test("[^[:space:]]") and (test("[[:cntrl:]]") | not) and (endswith("/") | not))
          ' "$GITHUB_EVENT_PATH"); then
            echo "::error::appKey must be a nonempty object key without control characters or a trailing slash"
            exit 1
          fi
          python3 ./signer/upload.py -- "$RUNNER_TEMP/signed.ipa" "$object_key"
          printf 'Signed IPA uploaded.\n' >> "$GITHUB_STEP_SUMMARY"
